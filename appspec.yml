version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/seeken-nuxt
    overwrite: yes

hooks:
  BeforeInstall:
    - location: scripts/clean_folder.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu

  AfterAllowTestTraffic:
    - location: test.sh
      timeout: 60
      runas: ubuntu