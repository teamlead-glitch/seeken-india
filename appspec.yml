version: 0.0
os: linux

files:
  - source: /
    destination: /opt/seeken-nuxt
    overwrite: yes

hooks:
  BeforeInstall:
    - location: scripts/clean_folder.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ssm-user

  ApplicationStart:
    - location: scripts/start_service.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/health_check.sh
      timeout: 60
      runas: ssm-user