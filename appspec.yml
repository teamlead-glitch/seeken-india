version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/nuxt-app
    overwrite: yes

hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu
  AfterAllowTestTraffic:
    - location: /home/ubuntu/nuxt-app/test.sh  
      timeout: 60
      runas: ubuntu
