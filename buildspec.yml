version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "STARTING"

  build:
    commands:
      - echo "Zipping project into build_output.zip..."
      - zip -r ../build_output.zip . 
      - mkdir -p output
      - mv ../build_output.zip output/

artifacts:
  files:
    - build_output.zip
  base-directory: output