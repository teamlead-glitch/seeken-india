---
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Node dependencies..."
      - npm install

  build:
    commands:
      - echo "Skipping build step (No `npm run build` needed)"

  post_build:
    commands:
      - echo "Preparing output directory for artifact packaging..."
      - mkdir -p output
      - rsync -av --exclude=output ./ output/
      - echo "Build completed. Contents of output directory:"
      - ls -al output/

artifacts:
  files:
    - '**/*'
  base-directory: output
  name: "${APP_ENV}-$(date +%Y-%m-%d).zip"

  