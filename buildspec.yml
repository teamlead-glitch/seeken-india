version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Building the Nuxt SSR app...
      - npm run build
  post_build:
    commands:
      - echo Preparing artifacts...
      - mkdir -p output
      - cp -r .output output/.output
      - cp -r .nuxt output/.nuxt || true
      - cp -r node_modules output/node_modules
      - cp -r public output/public || true
      - cp package*.json output/
      - cp ecosystem.config.js output/ || true
      - cp test.sh output/test.sh
      - echo "All necessary files copied to output."
      - ls -l output/ 
      - echo Build completed.

artifacts:
  files:
    - '**/*'
  base-directory: output
