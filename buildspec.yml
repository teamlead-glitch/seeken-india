version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies"
      - npm install -g pm2
      - apt-get update && apt-get install -y jq openssh-client

  pre_build:
    commands:
      - echo "Fetching SSH private key from Secrets Manager"
      - SECRET=$(aws secretsmanager get-secret-value --secret-id ec2-ssh-private-key --query SecretString --output text)
      - echo "$SECRET" | jq -r .ssh_private_key > key.pem
      - chmod 400 key.pem

  build:
    commands:
      - echo "Copying source files to EC2 instance"
      - scp -o StrictHostKeyChecking=no -i key.pem -r . ubuntu@13.232.44.241:/home/ubuntu/nuxt-app

      - echo "Deploying on EC2 via SSH"
      - ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@13.232.44.241 << 'EOF'
          cd ~/nuxt-app
          npm install
          npm run build
          pm2 restart nuxt-app || pm2 start .output/server/index.mjs --interpreter=node --name nuxt-app
          pm2 save
          echo "Restarting Nginx"
          sudo systemctl restart nginx
        EOF