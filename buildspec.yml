version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "STARTING"

  build:
    commands:
      - mkdir -p output
      - bash -c 'shopt -s dotglob nullglob && cp -r -- * output/'
      - zip -r build_output.zip . -x "./output/*"

artifacts:
  files:
    - '**/*'
  base-directory: output