version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install

  build:
    commands:
      - echo Building the Nuxt SSR app...
      - npm run build

  post_build:
    commands:
      - echo Preparing output directory...
      - mkdir -p output
      - echo Copying everything to output directory...
      - cp -a . output/
      - echo Listing contents of output directory:
      - ls -al output
      - echo Build completed.

artifacts:
  files:
    - '**/*'
  base-directory: output
