version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "STARTING"

  build:
    commands:
      - echo "Skipping build step (No `npm run build` needed)"
      - mkdir -p output
      - echo "Copying all files (including hidden) to output directory..."
      - cp -r ./* ./.??* output/ 2>/dev/null || true

artifacts:
  files:
    - '**/*'
  base-directory: output
