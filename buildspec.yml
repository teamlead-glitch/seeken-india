---
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Node dependencies..."
      - npm install

  build:
    commands:
      - echo "Skipping build step (No `npm run build` needed)"
      - mkdir -p output
      - echo "Copying files to output directory..."
      - cp -r ./.* ./output/ || echo "No files to copy"


  
  